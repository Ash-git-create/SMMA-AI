# Phase 3 ablation: targeted validation + cascade deprecation ONLY (no
# retrieval floor). Isolates the active Trio mechanisms: detection +
# quarantine without confidence-based exclusion — quarantined nodes drop to
# confidence 0 but remain retrievable in principle (they rank last, so the
# top-k cut usually excludes them; that ranking effect is part of what this
# arm measures). Diff vs contamination_mitigated.yaml: retrieval_threshold
# 0.5 -> 0.0.

steps: 10
entities_per_step: 12
injections_per_type: 15
pool_per_key: 50

context_limit: 5
retrieval_threshold: 0.0

audits_per_step: 1
audit_sample: 25
audit_targeted: true
quarantine_threshold: 0.4

trio_confidence: true

eval_every: 5
eval_questions: 50
probe_limit: 60
probe_facts: 8

random_seed: 42
sleep: 1.0
tag: ablation_validation
