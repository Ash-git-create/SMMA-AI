# RQ3 write-frequency sweep (LOW): entities_per_step 6 vs baseline 12.
# Identical to contamination_baseline.yaml except entities_per_step.
# Write frequency = how many active entities get re-synthesised/re-extracted
# per cycle = memory write rate; a component of the beta channel (more writes
# per step = more retrieval-then-writeback events = faster transmission).
# Baseline (unmitigated, gamma=0) substrate isolates the beta effect.
steps: 10
entities_per_step: 6
injections_per_type: 15
pool_per_key: 50
context_limit: 5
retrieval_threshold: 0.0
audits_per_step: 0
audit_sample: 50
eval_every: 5
eval_questions: 50
probe_limit: 60
probe_facts: 8
random_seed: 42
sleep: 1.0
tag: wf6
